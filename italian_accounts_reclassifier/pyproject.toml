[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "italian-accounts-reclassifier"
version = "0.1.0"
description = "Local-only Windows desktop app skeleton for Italian accounts reclassification."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Plimsoll Publishing Ltd"}]
dependencies = [
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "rapidfuzz>=3.5.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6.0"]
pdf = ["pdfplumber>=0.10.0", "pypdf>=3.17.0", "PyMuPDF>=1.23.0"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0", "opencv-python>=4.8.0"]
xbrl = ["arelle-release>=2.31.0", "lxml>=4.9.0"]
excel = ["xlrd>=2.0.1", "pywin32>=306; platform_system == 'Windows'"]
dev = ["pytest>=7.4.0"]
all = [
    "PySide6>=6.6.0",
    "pdfplumber>=0.10.0",
    "pypdf>=3.17.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "arelle-release>=2.31.0",
    "lxml>=4.9.0",
    "xlrd>=2.0.1",
    "pywin32>=306; platform_system == 'Windows'",
    "pytest>=7.4.0",
]

[project.scripts]
italian-accounts-reclassifier = "italian_accounts_reclassifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
